[workspace]
resolver = "2"
members = [
    "crates/aquapilot-domain",
    "crates/aquapilot-model",
    "crates/aquapilot-engine",
    "crates/aquapilot-service",
    "crates/aquapilot-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.17"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
