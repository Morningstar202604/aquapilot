[package]
name = "aquapilot-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aquapilot-domain = { path = "../aquapilot-domain" }
aquapilot-engine = { path = "../aquapilot-engine" }
aquapilot-model = { path = "../aquapilot-model" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
futures-util = "0.3"
ureq = { version = "2", features = ["json"] }
async-opcua = { version = "0.19", features = ["client"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
