[package]
name = "aquapilot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aquapilot-v2"
path = "src/main.rs"

[dependencies]
aquapilot-domain = { path = "../aquapilot-domain" }
aquapilot-engine = { path = "../aquapilot-engine" }
aquapilot-model = { path = "../aquapilot-model" }
aquapilot-service = { path = "../aquapilot-service" }
clap.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
