# Gitee Go 流水线（Gitee 原生 CI）
# 用途：在 Gitee 上真实执行与 GitHub Actions 等价的门禁。
# 说明：.github/workflows/ci.yml 只在 GitHub 生效；本文件是 Gitee 的实现。
version: '1.0'
name: aquapilot-ci
displayName: AquaPilot CI

triggers:
  push:
    branches:
      include:
        - main
  pull_request:
    branches:
      include:
        - main

variables:
  NODE_VERSION: '22'

stages:
  - stage:
      name: verify
      displayName: Verify
      steps:
        - step: gate
          name: gate
          displayName: Local CI gate
          script: |
            set -e
            node --version
            npm run ci

        - step: browser-install
          name: browser-install
          displayName: Install Chromium
          script: |
            set -e
            npx --no-install playwright-core install --with-deps chromium

        - step: browser-smoke
          name: browser-smoke
          displayName: Browser smoke
          script: |
            set -e
            npm run e2e

  - stage:
      name: quality
      displayName: Quality gate
      steps:
        - step: secrets
          name: secrets
          displayName: Secret scan
          script: |
            set -e
            if git grep -nIE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' -- . ':(exclude)package-lock.json'; then
              echo "secret found"; exit 1
            fi
            echo "no secrets"

        - step: artifacts
          name: artifacts
          displayName: Artifact scan
          script: |
            set -e
            if [ -n "$(git ls-files dist out node_modules | head -1)" ]; then
              echo "build artifacts committed"; exit 1
            fi
            echo "clean"
