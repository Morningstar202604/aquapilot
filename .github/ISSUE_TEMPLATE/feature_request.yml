name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Process model
        - AI decision layer
        - UI / flowsheet
        - Server / protocol
        - Tooling / CI
