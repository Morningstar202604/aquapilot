name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Verify (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 declares `engines: ^22.12.0 || ^24.0.0 || >=26.0.0`, so Node 20
        # cannot run this suite. Testing the declared floor (22.12) and the current
        # LTS line (24) covers "oldest supported" and "what most users run" without
        # adding a matrix leg that is guaranteed to fail.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Dependency audit
        run: |
          # A network/TLS failure reaching the advisory endpoint is "not verified",
          # not "vulnerable". Distinguish the two so the job does not produce a
          # misleading red. A real advisory still fails the build.
          if OUT=$(npm audit --audit-level=high 2>&1); then
            echo "0 high/critical vulnerabilities"
          elif printf '%s' "$OUT" | grep -qiE 'ENOTFOUND|ETIMEDOUT|ECONNREFUSED|EAI_AGAIN|SSL|TLS|dh key too small|audit endpoint returned an error'; then
            echo "$OUT" | tail -5
            echo "::error::Dependency audit could not reach the advisory service; refusing a green result"
            exit 1
          else
            echo "$OUT" | tail -20
            echo "::error::Vulnerable dependencies found"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Smoke test production server
        run: |
          node dist/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/api/snapshot > /dev/null; then break; fi
            sleep 1
          done
          echo "--- snapshot keys ---"
          curl -sf http://127.0.0.1:5173/api/snapshot | head -c 200
          echo
          echo "--- topology ---"
          curl -sf http://127.0.0.1:5173/api/topology | head -c 200
          echo
          echo "--- metrics ---"
          curl -sf http://127.0.0.1:5173/api/metrics | head -12
          curl -sf "http://127.0.0.1:5173/api/metrics?format=json" | head -c 200
          echo
          kill $SERVER_PID

  e2e:
    permissions:
      contents: read
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install CJK fonts
        # UI 全中文；ubuntu-latest 不带任何 CJK 字形，回退字体度量更宽，
        # 顶栏裁切与页签换行断言会假失败（本地 Windows 有雅黑所以看不出来）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Run browser smoke
        run: npx tsx scripts/e2e-ci.ts
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "--- chromium present? ---"
          npx playwright-core install --list 2>&1 | head -20 || true
          echo "--- e2e temp data ---"
          ls -la out/e2e-data 2>&1 | head -20 || true
          echo "--- server log ---"
          ls -la out/ 2>&1 | head -20 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: out/shots/
          retention-days: 7

  quality-gate:
    permissions:
      contents: read
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure no secrets committed
        run: |
          set -e
          # 令牌/密钥模式扫描（只扫受版本控制的源码与文档）
          pattern='(gh[pousr]_[A-Za-z0-9_\-]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|https?://[^/[:space:]@]+:[^@[:space:]]+@)'
          if matches=$(git grep -lIE "$pattern" -- . 2>/dev/null); then
            printf '%s\n' "$matches" | sed 's#^#疑似敏感文件：#'
            echo "::error::发现疑似凭据，禁止提交"
            exit 1
          else
            status=$?
            [ "$status" -eq 1 ] || { echo "::error::密钥扫描工具失败（退出码 $status）"; exit 1; }
          fi
          echo "密钥扫描通过"

      - name: Documentation visibility
        run: node scripts/check-docs.mjs

      - name: Ensure no build artifacts committed
        run: |
          set -e
          for p in dist out node_modules; do
            if ! tracked=$(git ls-files "$p"); then
              echo "::error::无法扫描 $p 的 Git 跟踪状态"
              exit 1
            fi
            if [ -n "$tracked" ]; then
              echo "::error::$p 不应被提交"
              exit 1
            fi
          done
          echo "构建产物未入库"

      - name: Backup round-trip
        run: |
          set -e
          # 用真实 CLI 走一遍：写数据 → VACUUM INTO 备份 → 恢复 → 读回行数
          npx tsx scripts/backup-seed.ts .ci-backup.db
          npx tsx scripts/backup.ts create --db .ci-backup.db --out .ci-backup-snapshot.db
          npx tsx scripts/backup.ts restore --from .ci-backup-snapshot.db --db .ci-restored.db --yes
          npx tsx scripts/backup-seed.ts .ci-restored.db --verify 5

      - name: Test count floor
        run: |
          set -e
          npx vitest run --reporter=json --outputFile=test-results.json > /dev/null 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
          const count = report.numTotalTests ?? 0;
          const passed = report.numPassedTests ?? 0;
          const failed = report.numFailedTests ?? 0;
          const skipped = report.numPendingTests ?? 0;
          const todo = report.numTodoTests ?? 0;
          console.log(`测试数量: ${count}（通过 ${passed}，失败 ${failed}，跳过 ${skipped}，todo ${todo}）`);
          if (count < 300) {
            console.error(`::error::测试数量低于下限 300（当前 ${count}），可能有测试被删除`);
            process.exit(1);
          }
          if (passed !== count || failed !== 0 || skipped !== 0 || todo !== 0) {
            console.error('::error::测试报告存在失败、跳过或 todo 用例');
            process.exit(1);
          }
          NODE
