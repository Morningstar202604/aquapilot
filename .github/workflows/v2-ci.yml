name: v2-ci

on:
  push:
    paths:
      - 'rust-v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'rust-v2/**'
      - '.github/workflows/v2-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust-v2 -> target'
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke single reactor
        run: cargo run -q -p aquapilot-cli -- validate fixtures/single-aerobic.json
      - name: Smoke three-stage series
        run: cargo run -q -p aquapilot-cli -- simulate fixtures/three-stage.json --minutes 1440 --json > /tmp/three-stage.json
      - name: Smoke official BSM1 fixture
        run: cargo run -q -p aquapilot-cli -- validate fixtures/bsm1-official.json
      - name: Smoke BSM1-like 30 days
        run: cargo run -q -p aquapilot-cli -- simulate fixtures/bsm1-like.json --minutes 43200 --json > /tmp/bsm1-30d.json
      - name: Smoke ASM2d A2O 30 days
        run: cargo run -q -p aquapilot-cli -- asm2d fixtures/a2o-asm2d.json --minutes 43200 --json > /tmp/a2o-30d.json
      - name: Smoke ASM2d A2O + PAC 30 days
        run: cargo run -q -p aquapilot-cli -- asm2d fixtures/a2o-asm2d-pac.json --minutes 43200 --json > /tmp/a2o-pac.json
      - name: Smoke ASM2d A2O + PAC + tertiary 30 days
        run: cargo run -q -p aquapilot-cli -- asm2d fixtures/a2o-asm2d-pac-tertiary.json --minutes 43200 --json > /tmp/a2o-tertiary.json
      - name: Smoke ASM2d two-train 30 days
        run: cargo run -q -p aquapilot-cli -- asm2d-parallel fixtures/a2o-asm2d-2train.json --minutes 43200 --json > /tmp/a2o-2train.json
      - name: Smoke ADM1 tutorial
        run: cargo run -q -p aquapilot-cli -- adm1 fixtures/adm1-tutorial.json --days 10 --dt 0.002 --json > /tmp/adm1.json
      - name: Smoke ADM1 sludge line
        run: cargo run -q -p aquapilot-cli -- sludge-line fixtures/adm1-sludge-line.json --days 20 --dt 0.002 --json > /tmp/adm1-sludge.json
      - name: Smoke A2O to ADM1 one-way coupling
        run: cargo run -q -p aquapilot-cli -- asm2d-sludge fixtures/a2o-asm2d.json --minutes 43200 --sludge-days 20 --json > /tmp/a2o-sludge.json
      - name: Smoke A2O + ADM1 closed recycle loop
        run: cargo run -q -p aquapilot-cli -- asm2d-loop fixtures/a2o-asm2d.json --minutes 43200 --dt 1 --sludge-days 30 --sludge-dt 0.002 --max-iterations 6 --relaxation 1.0 --json > /tmp/a2o-loop.json
      - name: Assert finite snapshot
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/three-stage.json'))
          assert s['step_count'] == 1440
          assert len(s['reactors']) == 3
          for value in (s['effluent']['cod'], s['effluent']['nh4_n'], s['effluent']['do']):
              assert isinstance(value, (int, float)) and value == value

          b = json.load(open('/tmp/bsm1-30d.json'))
          assert b['step_count'] == 43200
          assert len(b['reactors']) == 5
          assert len(b['clarifiers']) == 1
          assert b['effluent']['cod'] < 60.0
          assert b['effluent']['ss'] < 20.0
          assert b['effluent']['nh4_n'] < 5.0
          assert all(2000.0 <= r['mlss'] <= 4000.0 for r in b['reactors'])

          a = json.load(open('/tmp/a2o-30d.json'))
          assert a['step_count'] == 43200
          assert len(a['reactors']) == 5
          assert a['effluent']['cod'] < 60.0
          assert a['effluent']['nh4_n'] < 2.0
          assert a['effluent']['tp'] < 2.0
          assert a['effluent']['ss'] < 20.0
          for name in ('cod', 'nitrogen', 'phosphorus'):
              assert a['mass_balance'][name]['closed'] is True
              assert a['mass_balance'][name]['residual_fraction'] < 0.05

          p = json.load(open('/tmp/a2o-pac.json'))
          assert p['pac'] is not None
          assert p['pac']['dose_mg_l'] == 40.0
          assert p['pac']['net_chemical_p_removed_kg'] > 0.0
          assert p['effluent']['po4_p'] < 0.5
          assert p['effluent']['tp'] < 1.3
          assert p['mass_balance']['phosphorus']['closed'] is True

          t = json.load(open('/tmp/a2o-tertiary.json'))
          assert t['tertiary'] is not None
          assert t['tertiary']['capture_fraction'] == 0.9
          assert t['tertiary']['po4_removal_fraction'] == 0.7
          assert t['tertiary']['captured_solids_kg'] > 0.0
          assert t['effluent']['ss'] < 3.0
          assert t['effluent']['tp'] < 0.5
          assert t['mass_balance']['phosphorus']['closed'] is True

          m = json.load(open('/tmp/adm1.json'))
          assert 6.8 <= m['ph'] <= 7.8
          assert m['biogas_m3_per_d'] > 1000.0
          assert m['cod_balance']['closed'] is True
          assert abs(m['cod_balance']['residual']) < 0.05
          assert m['nitrogen_balance']['closed'] is True
          assert abs(m['nitrogen_balance']['residual']) < 0.05

          sl = json.load(open('/tmp/adm1-sludge.json'))
          assert sl['thickened']['flow_m3_per_d'] == 120.0
          assert sl['cake']['flow_m3_per_d'] > 0.0
          assert abs(sl['cod_balance']['residual']) < 0.03
          assert abs(sl['nitrogen_balance']['residual']) < 0.03
          assert abs(sl['phosphorus_balance']['residual']) < 0.01

          cs = json.load(open('/tmp/a2o-sludge.json'))['sludge']
          assert 6900.0 < cs['asm2d_cod_kg_per_m3'] < 7000.0
          for name in ('cod_balance', 'nitrogen_balance', 'phosphorus_balance'):
              assert cs['line'][name]['closed'] is True
              assert abs(cs['line'][name]['residual']) < 0.02

          lp = json.load(open('/tmp/a2o-loop.json'))
          assert lp['converged'] is True
          assert lp['iterations'] <= 6
          assert lp['recycle_flow_m3_h'] > 0.0
          expected = (lp['sludge']['line']['thickener_overflow']['flow_m3_per_d']
                      + lp['sludge']['line']['filtrate']['flow_m3_per_d']) / 24.0
          assert abs(lp['recycle_flow_m3_h'] - expected) < 1.0e-9
          assert lp['asm2d']['effluent']['cod'] < 60.0
          assert lp['asm2d']['effluent']['nh4_n'] < 2.0
          assert lp['asm2d']['effluent']['ss'] < 20.0
          for name in ('cod', 'nitrogen', 'phosphorus'):
              assert lp['whole_balance'][name]['closed'] is True
              assert abs(lp['whole_balance'][name]['residual']) < 0.05
          print('v2 smoke ok')
          PY
