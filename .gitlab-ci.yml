# GitLab CI/CD. Self-contained: same gates as the GitHub workflow, no browser job
# (Playwright browsers are not preinstalled on the shared runner image).
stages: [verify, quality]

default:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

verify:
  stage: verify
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run format
    - npx vitest run --coverage
    - npm run build
    - |
      PORT=5184 node dist/server/index.mjs &
      PID=$!
      ok=0
      for i in $(seq 1 30); do
        if curl -sf http://127.0.0.1:5184/api/snapshot > /dev/null; then ok=1; break; fi
        sleep 1
      done
      [ "$ok" -eq 1 ] || { kill $PID 2>/dev/null || true; exit 1; }
      curl -sf http://127.0.0.1:5184/api/topology | grep -q '"topology"'
      curl -sf http://127.0.0.1:5184/api/presets | grep -q '"presets"'
      kill $PID 2>/dev/null || true
  artifacts:
    when: always
    paths: [coverage/]
    expire_in: 7 days

quality:
  stage: quality
  script:
    - npm ci
    - |
      set -e
      if git grep -nIE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':(exclude)package-lock.json' ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/ci-gate.sh' ':(exclude).gitlab-ci.yml'; then
        echo "secret found"; exit 1
      fi
      if [ -n "$(git ls-files dist out node_modules | head -1)" ]; then
        echo "build artifacts committed"; exit 1
      fi
    - npm audit --audit-level=high || echo "audit endpoint unreachable; unverified"
