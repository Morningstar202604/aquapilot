[package]
name = "aquapilot-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI provider, hash-chained audit, per-client rate limit and watchdog for AquaPilot"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
url = "2.5.9"

[lints]
workspace = true
