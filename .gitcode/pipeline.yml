# GitCode / GitCode CI 流水线配置
# 等价于 .github/workflows/ci.yml 的门禁，供 GitCode 平台执行。
name: aquapilot-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Smoke
        run: |
          set -e
          PORT=5182 node dist/server/index.mjs &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5182/api/snapshot > /dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" -eq 1 ] || { kill $PID 2>/dev/null || true; exit 1; }
          curl -sf http://127.0.0.1:5182/api/topology | grep -q '"topology"'
          kill $PID 2>/dev/null || true
