# GitCode / GitCode CI 流水线配置
# 等价于 .github/workflows/ci.yml 的门禁，供 GitCode 平台执行。
name: aquapilot-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Local CI gate
        run: npm run ci
      - name: Install Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser smoke
        run: npm run e2e
